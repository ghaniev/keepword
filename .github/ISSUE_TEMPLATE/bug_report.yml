name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: App
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App and OS version
      placeholder: Keepword 0.1.0, macOS 15.6 (M2)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Leave out meeting content and API keys.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      render: text
