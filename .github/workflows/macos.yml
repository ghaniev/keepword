name: macOS
on:
  workflow_dispatch:
  push:
    paths: ['macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  build:
    # Swift 6.2 (Xcode 26) is required: the app links libswiftCompatibilitySpan.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: macos/.build
          key: spm-${{ runner.os }}-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: swift build
      - name: Self-test
        # The debug binary has no /usr/lib/swift rpath (build_app.sh adds it to the app bundle).
        run: DYLD_FALLBACK_LIBRARY_PATH=/usr/lib/swift .build/debug/MeetNotes --selftest
      - name: App bundle
        run: ./build_app.sh
